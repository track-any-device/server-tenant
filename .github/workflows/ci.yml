name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_ORG: trackanydevice

# ──────────────────────────────────────────────────────────────────────────────
# Step 1 — Code quality (always, including PRs)
# ──────────────────────────────────────────────────────────────────────────────
jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install PHP dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: PHP lint (Pint)
        run: composer lint

      - name: JS lint (ESLint)
        run: pnpm run lint:check

      - name: JS format (Prettier)
        run: pnpm run format:check

# ──────────────────────────────────────────────────────────────────────────────
# Step 2 — Tests (PHP 8.4 + 8.5 matrix, always, including PRs)
# ──────────────────────────────────────────────────────────────────────────────
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Symfony 8.1 in composer.lock requires PHP >=8.4.1
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, xml, ctype, json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests
        run: ./vendor/bin/pest

# ──────────────────────────────────────────────────────────────────────────────
# Step 3 — Docker build + push (main push only, after lint + tests)
# ──────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [lint, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Derive version
        id: version
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "version=v0.1.${COUNT}-${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push server-tenant
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_ORG }}/server-tenant:latest
            ${{ env.DOCKERHUB_ORG }}/server-tenant:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=server-tenant-v2
          cache-to: type=gha,mode=max,scope=server-tenant-v2
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_SHA=${{ github.sha }}

# ──────────────────────────────────────────────────────────────────────────────
# Step 4 — GitHub release (after successful build)
# ──────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive version
        id: version
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "version=v0.1.${COUNT}-${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          COMMITS=$(git log --oneline "${PREV}..HEAD" 2>/dev/null || git log --oneline HEAD~10..HEAD)
          {
            echo "body<<EOF"
            echo "## What's changed"
            echo ""
            echo "$COMMITS" | sed 's/^/- /'
            echo ""
            echo "## Docker image"
            echo "| Image | Tag |"
            echo "|---|---|"
            echo "| \`trackanydevice/server-tenant\` | \`${{ steps.version.outputs.version }}\` |"
            echo ""
            echo "Pull: \`docker pull trackanydevice/server-tenant:${{ steps.version.outputs.version }}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false

# ── 5. Bump version in .github/install.sh ────────────────────────────────────
  bump-install:
    name: Bump install.sh
    needs: [build, release]
    if: needs.release.result == 'success'
    uses: track-any-device/.github/.github/workflows/bump-install-version.yml@main
    with:
      service: TAD_SERVER_TENANT_TAG
      version: ${{ needs.build.outputs.version }}
      commit_message: "chore: bump server-tenant to ${{ needs.build.outputs.version }} in install.sh [skip ci]"
    secrets:
      GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
