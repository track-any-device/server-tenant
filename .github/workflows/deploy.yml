name: Deploy

on:
  push:
    branches: [main]

# Non-cancellable: a quick follow-up push queues instead of killing an
# in-flight production deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_ORG: trackanydevice

jobs:

  # ── 1. Build & push tenant portal image ───────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "version=v0.1.${COUNT}-${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push server-tenant
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_ORG }}/server-tenant:latest
            ${{ env.DOCKERHUB_ORG }}/server-tenant:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=server-tenant
          cache-to: type=gha,mode=max,scope=server-tenant
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_SHA=${{ github.sha }}

  # ── 2. GitHub release ──────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: version
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHORT=$(git rev-parse --short HEAD)
          VERSION="v0.1.${COUNT}-${SHORT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          COMMITS=$(git log --oneline "${PREV}..HEAD" 2>/dev/null || git log --oneline HEAD~10..HEAD)
          {
            echo "body<<EOF"
            echo "## What's changed"
            echo ""
            echo "$COMMITS" | sed 's/^/- /'
            echo ""
            echo "## Docker image"
            echo ""
            echo "| Image | Tag |"
            echo "|---|---|"
            echo "| \`trackanydevice/server-tenant\` | \`${{ steps.version.outputs.version }}\` |"
            echo ""
            echo "Pull: \`docker pull trackanydevice/server-tenant:${{ steps.version.outputs.version }}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
